# Tomcat
server:
  port: 8086

# Spring
spring:
  application:
    # 应用名称
    name: travel-file
  profiles:
    # 环境配置：改为 local，与 application.yml 一致
    active: local
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置：如果 Nacos 中没有 application-local.yml 可以把这一行注释掉，避免启动报错
        # shared-configs:
        #   - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
